plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

version = "${mod_version}+${mc_line}-neoforge"
group = 'com.kishku7.lavaboats'
base { archivesName = 'lava-boats' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']

neoForge {
    version = project.neo_version
    runs {
        server { server(); programArgument '--nogui' }
        client { client() }
    }
    mods {
        lavaboats { sourceSet(sourceSets.main) }
    }
}

processResources {
    def pf = System.getenv("PACK_FORMAT") ?: "84"
    def ep = [mod_version: mod_version, mcRange: project.mc_range, neoforgeRange: project.neoforge_range, packFormat: pf]
    inputs.properties(ep)
    filesMatching('META-INF/neoforge.mods.toml') { expand(ep) }
    filesMatching("pack.mcmeta") { expand([packFormat: pf]) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
}
