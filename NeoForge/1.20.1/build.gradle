plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = 'com.kishku7'
base { archivesName = 'lava-boats' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

// NeoForge 1.20.1 (47.x) is a Forge 1.20.1 fork: SRG-named at runtime.
// Build with ForgeGradle 6 + the SpongePowered mixin plugin so the annotation processor
// GENERATES a Mojmap->SRG refmap (lavaboats.refmap.json) and the jar manifest gets the
// MixinConfigs attribute. Target the neoforged 'forge' artifact so deps/ATs line up with
// the NeoForge 1.20.1 server.
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

mixin {
    add sourceSets.main, 'lavaboats.refmap.json'
    config 'lavaboats-common.mixins.json'
    config 'lavaboats-common-client.mixins.json'
    config 'lavaboats-forge.mixins.json'
}

dependencies {
    minecraft 'net.neoforged:forge:1.20.1-47.1.106'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
}


sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']

// D23 -- stamp the real version into the JAR MANIFEST. mods.toml declares
// version = "${file.jarVersion}", which FML fills from Implementation-Version; without it the
// loader reports 0.0NONE. The -forge / -neoforge filename suffix is stripped from the value.
jar {
    manifest {
        attributes([
            'Implementation-Title'  : 'Lava Boats',
            'Implementation-Version': project.version.toString().replaceAll(/-(neo)?forge$/, ''),
            'Implementation-Vendor' : 'Kishku7'
        ])
    }
}
