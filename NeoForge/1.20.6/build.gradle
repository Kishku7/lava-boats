plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = 'com.kishku7'
base { archivesName = 'lava-boats' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '20.6.139'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
    options.release = 21
}

// ModDevGradle does not interpolate ${version} in neoforge.mods.toml; the loader reads the mod
// version from the jar manifest Implementation-Version (referenced as ${file.jarVersion}).
// Mixin configs are wired via the neoforge.mods.toml [[mixins]] blocks (NeoForge 20.5+ feature),
// mojmap-native so no refmap is needed.
jar {
    manifest {
        attributes 'Implementation-Version': '1.2.0'
    }
}


sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']