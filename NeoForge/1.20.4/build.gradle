plugins {
    id 'eclipse'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

version = project.mod_version
group = 'com.kishku7'
base { archivesName = 'lava-boats' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

dependencies {
    implementation 'net.neoforged:neoforge:20.4.237'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
    options.release = 17
}

// NeoForge 20.4 (MC 1.20.2-1.20.4) is pre-rename: legacy META-INF/mods.toml and it reads
// mixin configs from the JAR manifest MixinConfigs attribute, NOT a toml [[mixins]] block
// (that block is a 20.5+ feature). Declare all three configs here. ${file.jarVersion} in
// mods.toml is resolved by the loader at runtime from the jar manifest Implementation-Version.
jar {
    manifest {
        attributes([
            'MixinConfigs': 'lavaboats-common.mixins.json,lavaboats-common-client.mixins.json,lavaboats-neoforge-client.mixins.json'
        ])
    }
}


sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']