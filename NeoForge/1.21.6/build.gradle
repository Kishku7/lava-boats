plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = 'com.kishku7'
base { archivesName = 'lava-boats' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.srcDir 'gen/src/main/java'
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']

neoForge {
    version = project.neo_version
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:all'
}

// ModDevGradle does not interpolate ${version} in neoforge.mods.toml; the loader reads the mod
// version from the jar manifest Implementation-Version (referenced as ${file.jarVersion}).
// D23 -- stamp the real version into the JAR MANIFEST. mods.toml declares
// version = "${file.jarVersion}", which FML fills from Implementation-Version; without it the
// loader reports 0.0NONE. The -forge / -neoforge filename suffix is stripped from the value.
jar {
    manifest {
        attributes([
            'Implementation-Title'  : 'Lava Boats',
            'Implementation-Version': project.version.toString().replaceAll(/-(neo)?forge$/, ''),
            'Implementation-Vendor' : 'Kishku7'
        ])
    }
}
