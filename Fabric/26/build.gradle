plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = "${project.mod_version}+${project.mc_line}-fabric"
group = project.maven_group

base { archivesName = project.archives_base_name }

// Single-source: compile the cog-generated tree (scripts/cog-gen.ps1); the 26 twin was merged out.
sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    compileOnly localRuntime("net.fabricmc:fabric-loader:${project.loader_version}")
    compileOnly localRuntime("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
}

processResources {
    def pf = System.getenv("PACK_FORMAT") ?: "84"
    inputs.properties(["version": project.version, "mcLower": project.mc_lower, "mcUpper": project.mc_upper, "packFormat": pf])
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mcLower": project.mc_lower, "mcUpper": project.mc_upper
    }
    filesMatching("pack.mcmeta") {
        expand "packFormat": pf
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs << '-Xlint:all'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
